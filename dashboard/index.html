<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Access — Risk Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2d3148;
      --text: #e2e8f0;
      --text-muted: #8892aa;
      --accent: #6c8ef7;
      --low: #34d399;
      --low-bg: rgba(52,211,153,.12);
      --medium: #fbbf24;
      --medium-bg: rgba(251,191,36,.12);
      --high: #f97316;
      --high-bg: rgba(249,115,22,.12);
      --critical: #ef4444;
      --critical-bg: rgba(239,68,68,.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; }

    /* Auth screen */
    #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 400px; text-align: center; }
    .auth-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .auth-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .auth-card input { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: monospace; margin-bottom: 12px; }
    .auth-card input:focus { outline: none; border-color: var(--accent); }
    .auth-card input::placeholder { color: var(--text-muted); }

    /* Main layout */
    #app-screen { display: none; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .meta { color: var(--text-muted); font-size: 12px; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    /* Toolbar */
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .toolbar input[type=search] { flex: 1; min-width: 200px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; }
    .toolbar input[type=search]:focus { outline: none; border-color: var(--accent); }
    .filter-group { display: flex; gap: 6px; }
    .filter-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all .15s; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(108,142,247,.1); }
    .filter-btn.active-low { border-color: var(--low); color: var(--low); background: var(--low-bg); }
    .filter-btn.active-medium { border-color: var(--medium); color: var(--medium); background: var(--medium-bg); }
    .filter-btn.active-high { border-color: var(--high); color: var(--high); background: var(--high-bg); }
    .filter-btn.active-critical { border-color: var(--critical); color: var(--critical); background: var(--critical-bg); }

    /* Stats bar */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .stat .value { font-size: 28px; font-weight: 700; }
    .stat .label { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

    /* User cards */
    .user-list { display: flex; flex-direction: column; gap: 10px; }
    .user-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color .15s; }
    .user-card:hover { border-color: var(--accent); }
    .user-header { display: flex; align-items: center; gap: 16px; padding: 14px 18px; cursor: pointer; }
    .risk-badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-low { background: var(--low-bg); color: var(--low); }
    .badge-medium { background: var(--medium-bg); color: var(--medium); }
    .badge-high { background: var(--high-bg); color: var(--high); }
    .badge-critical { background: var(--critical-bg); color: var(--critical); }
    .badge-unknown { background: rgba(136,146,170,.12); color: var(--text-muted); }
    .user-name { font-weight: 600; font-size: 15px; flex: 1; }
    .user-meta { color: var(--text-muted); font-size: 12px; display: flex; gap: 16px; }
    .user-meta span { display: flex; align-items: center; gap: 4px; }
    .score-number { font-size: 22px; font-weight: 700; margin-left: auto; margin-right: 8px; }
    .chevron { color: var(--text-muted); font-size: 12px; transition: transform .2s; }
    .user-card.expanded .chevron { transform: rotate(180deg); }

    /* Detail panel */
    .user-detail { display: none; border-top: 1px solid var(--border); padding: 0 18px 18px; }
    .user-card.expanded .user-detail { display: block; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 14px 0; }
    .detail-stat { background: var(--surface2); border-radius: 8px; padding: 12px; }
    .detail-stat .ds-val { font-size: 20px; font-weight: 700; }
    .detail-stat .ds-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .risk-summary { background: var(--surface2); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .risk-summary h4 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .risk-summary p { color: var(--text); font-size: 13px; margin-bottom: 8px; }
    .key-factors { list-style: none; }
    .key-factors li { color: var(--text-muted); font-size: 13px; padding: 3px 0; padding-left: 16px; position: relative; }
    .key-factors li::before { content: '→'; position: absolute; left: 0; color: var(--accent); }

    /* Request table */
    .requests-section h4 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .req-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .req-table th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .req-table td { padding: 8px 10px; border-bottom: 1px solid rgba(45,49,72,.5); }
    .req-table tr:last-child td { border-bottom: none; }
    .status-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    .status-approved, .status-expired { background: rgba(52,211,153,.12); color: var(--low); }
    .status-pending { background: rgba(108,142,247,.12); color: var(--accent); }
    .status-denied { background: rgba(239,68,68,.12); color: var(--critical); }
    .status-revoked_early { background: rgba(249,115,22,.12); color: var(--high); }
    .status-network_loss { background: rgba(251,191,36,.12); color: var(--medium); }
    .status-expired_unanswered { background: rgba(148,163,184,.12); color: var(--text-muted); }
    .status-completed_by_user { background: rgba(52,211,153,.08); color: var(--low); }
    .no-requests { color: var(--text-muted); font-size: 13px; padding: 14px 0; }
    .log-toggle { background: none; border: none; color: var(--accent); font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; }
    .sudo-log-row td { padding: 0 10px 10px; }
    .sudo-log-pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 11px; font-family: monospace; white-space: pre-wrap; word-break: break-all; color: var(--text-muted); max-height: 300px; overflow-y: auto; margin: 0; }

    /* Shared components */
    button.btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .15s; }
    button.btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 60px 0; color: var(--text-muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .error-banner { background: var(--critical-bg); border: 1px solid var(--critical); color: var(--critical); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }
    .last-updated { color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>

<!-- Auth screen -->
<div id="auth-screen">
  <div class="auth-card">
    <div style="font-size:36px;margin-bottom:12px">🔐</div>
    <h1>Admin Access Dashboard</h1>
    <p>Enter your dashboard API key and the API endpoint URL to continue.</p>
    <input type="text" id="api-url-input" placeholder="https://…/Prod/dashboard" autocomplete="off" spellcheck="false">
    <input type="password" id="api-key-input" placeholder="API key" autocomplete="off">
    <div id="auth-error" style="color:var(--critical);font-size:12px;margin-bottom:10px;display:none"></div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- Main app -->
<div id="app-screen">
  <header>
    <h1>🔐 Admin Access — Risk Dashboard</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="last-updated" id="last-updated"></span>
      <button class="btn btn-ghost" onclick="loadDashboard()" id="refresh-btn">↻ Refresh</button>
      <button class="btn btn-ghost" onclick="doLogout()">Sign out</button>
    </div>
  </header>

  <main>
    <div id="error-banner" class="error-banner" style="display:none"></div>

    <!-- Stats -->
    <div class="stats" id="stats-bar" style="display:none">
      <div class="stat"><div class="value" id="stat-total">—</div><div class="label">Total users</div></div>
      <div class="stat"><div class="value" id="stat-high-risk" style="color:var(--high)">—</div><div class="label">High / Critical risk</div></div>
      <div class="stat"><div class="value" id="stat-requests">—</div><div class="label">Total requests</div></div>
      <div class="stat"><div class="value" id="stat-network">—</div><div class="label">Network revocations</div></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar" style="display:none">
      <input type="search" id="search-input" placeholder="Search by username…" oninput="renderUsers()">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" data-filter="low" onclick="setFilter('low', this)">🟢 Low</button>
        <button class="filter-btn" data-filter="medium" onclick="setFilter('medium', this)">🟡 Medium</button>
        <button class="filter-btn" data-filter="high" onclick="setFilter('high', this)">🟠 High</button>
        <button class="filter-btn" data-filter="critical" onclick="setFilter('critical', this)">🔴 Critical</button>
        <button class="filter-btn" data-filter="unscored" onclick="setFilter('unscored', this)">⬜ Unscored</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading-state" style="text-align:center;padding:60px 0">
      <div class="spinner"></div>
      <p style="color:var(--text-muted);margin-top:12px;font-size:13px">Loading dashboard…</p>
    </div>

    <!-- User list -->
    <div class="user-list" id="user-list"></div>
  </main>
</div>

<script>
  // API endpoint URL baked in at deploy time by deploy.sh.
  // If still a placeholder, the manual auth screen allows entry of both.
  const _EMBEDDED_API_URL = '__EMBEDDED_API_URL__';
  const _HAS_EMBEDDED_URL = !_EMBEDDED_API_URL.startsWith('__');

  // Single-use token from the Slack link (?token=<uuid>).
  // When present the dashboard authenticates via the token instead of an API key.
  const _urlParams = new URLSearchParams(location.search);
  const _TOKEN = _urlParams.get('token') || '';

  const SESSION_KEY = 'iru_dashboard_session';
  let allUsers = [];
  let currentFilter = 'all';
  let expandedUser = null;
  let userDetailCache = {};

  // ─── Auth ───────────────────────────────────────────────────────────────────

  function getSession() {
    if (_TOKEN && _HAS_EMBEDDED_URL) return { url: _EMBEDDED_API_URL, token: _TOKEN };
    try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch { return null; }
  }
  function setSession(url, key) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ url, key }));
  }
  function clearSession() {
    sessionStorage.removeItem(SESSION_KEY);
  }

  async function doLogin() {
    const url = (_HAS_EMBEDDED_URL ? _EMBEDDED_API_URL : document.getElementById('api-url-input').value.trim().replace(/\/$/, ''));
    const key = document.getElementById('api-key-input').value.trim();
    const errEl = document.getElementById('auth-error');
    errEl.style.display = 'none';
    if (!url || !key) { errEl.textContent = 'Both fields are required.'; errEl.style.display = 'block'; return; }
    if (!url.startsWith('https://')) { errEl.textContent = 'API endpoint must use HTTPS.'; errEl.style.display = 'block'; return; }
    try {
      const res = await fetch(url, { headers: { 'x-api-key': key } });
      if (res.status === 401) throw new Error('Invalid API key.');
      if (!res.ok) throw new Error(`Server returned ${res.status}.`);
      setSession(url, key);
      showApp();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  function doLogout() {
    clearSession();
    allUsers = [];
    userDetailCache = {};
    document.getElementById('user-list').innerHTML = '';
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display = 'flex';
  }

  function showApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    loadDashboard();
  }

  // ─── Data loading ────────────────────────────────────────────────────────────

  async function apiFetch(path) {
    const session = getSession();
    if (!session) throw new Error('Not authenticated');
    let qs = path || '';
    if (session.token) qs = qs ? `${qs}&token=${session.token}` : `token=${session.token}`;
    const url = qs ? `${session.url}?${qs}` : session.url;
    const headers = session.key ? { 'x-api-key': session.key } : {};
    const res = await fetch(url, { headers });
    if (res.status === 401) { doLogout(); throw new Error('Session expired — please sign in again.'); }
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    return res.json();
  }

  async function loadDashboard() {
    document.getElementById('loading-state').style.display = 'block';
    document.getElementById('user-list').innerHTML = '';
    document.getElementById('stats-bar').style.display = 'none';
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('error-banner').style.display = 'none';
    document.getElementById('refresh-btn').disabled = true;

    try {
      const data = await apiFetch('');
      allUsers = data.users || [];
      userDetailCache = {};
      expandedUser = null;
      renderStats();
      document.getElementById('stats-bar').style.display = 'grid';
      document.getElementById('toolbar').style.display = 'flex';
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('last-updated').textContent = `Updated ${new Date(data.generatedAt || Date.now()).toLocaleTimeString()}`;
      // Auto-filter to a specific user if linked from Slack (?user=username)
      if (window._targetUser) {
        const searchInput = document.getElementById('search-input');
        if (searchInput) searchInput.value = window._targetUser;
      }
      renderUsers();
      // Auto-expand the target user's card if linked directly
      if (window._targetUser) {
        const card = document.querySelector(`[data-username="${CSS.escape(window._targetUser)}"]`);
        if (card) {
          const header = card.querySelector('.user-header');
          if (header) header.click();
        }
        window._targetUser = null;
      }
    } catch (e) {
      document.getElementById('loading-state').style.display = 'none';
      const banner = document.getElementById('error-banner');
      banner.textContent = `Failed to load: ${e.message}`;
      banner.style.display = 'block';
    } finally {
      document.getElementById('refresh-btn').disabled = false;
    }
  }

  async function loadUserDetail(username) {
    if (userDetailCache[username]) return userDetailCache[username];
    const data = await apiFetch(`user=${encodeURIComponent(username)}`);
    userDetailCache[username] = data;
    return data;
  }

  // ─── Rendering ──────────────────────────────────────────────────────────────

  function renderStats() {
    const total = allUsers.length;
    const highRisk = allUsers.filter(u => ['high', 'critical'].includes(u.riskScore?.level)).length;
    const totalRequests = allUsers.reduce((s, u) => s + (u.totalRequests || 0), 0);
    const networkRevocations = allUsers.reduce((s, u) => s + (u.networkRevocations || 0), 0);
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-high-risk').textContent = highRisk;
    document.getElementById('stat-requests').textContent = totalRequests;
    document.getElementById('stat-network').textContent = networkRevocations;
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.className = 'filter-btn' + (b === btn ? ` active${filter !== 'all' ? '-' + filter : ''}` : '');
    });
    renderUsers();
  }

  function renderUsers() {
    const search = (document.getElementById('search-input').value || '').toLowerCase().trim();
    const list = document.getElementById('user-list');

    const filtered = allUsers.filter(u => {
      if (search && !u.username.toLowerCase().includes(search)) return false;
      if (currentFilter === 'all') return true;
      if (currentFilter === 'unscored') return !u.riskScore;
      return u.riskScore?.level === currentFilter;
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No users match the current filter.</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(u => renderUserCard(u)).join('');

    // Re-expand if user was expanded before
    if (expandedUser) {
      const card = list.querySelector(`[data-username="${CSS.escape(expandedUser)}"]`);
      if (card) card.classList.add('expanded');
    }
  }

  function renderUserCard(u) {
    const score = u.riskScore;
    const level = score?.level || 'unknown';
    const scoreNum = score?.score ?? '—';
    const badge = riskBadge(level, scoreNum);
    const scoreColor = riskColor(level);
    const lastSeen = u.lastRequestAt ? relativeTime(u.lastRequestAt) : 'never';

    return `<div class="user-card" data-username="${esc(u.username)}">
      <div class="user-header" onclick="toggleUser('${esc(u.username)}', this)">
        <div>
          <div class="user-name">${esc(u.username)}</div>
          <div class="user-meta">
            <span>📋 ${u.totalRequests} request${u.totalRequests !== 1 ? 's' : ''}</span>
            ${u.deniedCount ? `<span>❌ ${u.deniedCount} denied</span>` : ''}
            ${u.networkRevocations ? `<span>⚠️ ${u.networkRevocations} network revocation${u.networkRevocations !== 1 ? 's' : ''}</span>` : ''}
            <span>🕐 Last: ${lastSeen}</span>
          </div>
        </div>
        ${score ? `<div style="color:${scoreColor};font-size:22px;font-weight:700;margin-left:auto;margin-right:8px">${scoreNum}</div>` : ''}
        <div>${badge}</div>
        <div class="chevron">▼</div>
      </div>
      <div class="user-detail" id="detail-${esc(u.username)}">
        <div style="color:var(--text-muted);font-size:13px;padding:14px 0"><div class="spinner"></div> Loading history…</div>
      </div>
    </div>`;
  }

  async function toggleUser(username, headerEl) {
    const card = headerEl.closest('.user-card');
    const wasExpanded = card.classList.contains('expanded');

    // Collapse all
    document.querySelectorAll('.user-card.expanded').forEach(c => c.classList.remove('expanded'));

    if (wasExpanded) {
      expandedUser = null;
      return;
    }

    expandedUser = username;
    card.classList.add('expanded');

    const detailEl = document.getElementById(`detail-${username}`);
    if (userDetailCache[username]) {
      detailEl.innerHTML = renderUserDetail(userDetailCache[username]);
      return;
    }

    try {
      const data = await loadUserDetail(username);
      detailEl.innerHTML = renderUserDetail(data);
    } catch (e) {
      detailEl.innerHTML = `<p style="color:var(--critical);padding:14px 0;font-size:13px">Failed to load history: ${esc(e.message)}</p>`;
    }
  }

  function renderUserDetail(data) {
    const score = data.riskScore;
    const requests = (data.requests || []).slice(0, 100);

    let html = '';

    // Risk score — prominent header block
    if (score) {
      const scoreColor = riskColor(score.level);
      html += `<div class="risk-summary" style="display:flex;gap:16px;align-items:flex-start">
        <div style="text-align:center;flex-shrink:0;background:var(--surface);border:2px solid ${scoreColor};border-radius:10px;padding:12px 18px;min-width:80px">
          <div style="font-size:32px;font-weight:800;color:${scoreColor};line-height:1">${score.score}</div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-top:4px">/ 100</div>
          <div style="margin-top:8px">${riskBadge(score.level, '')}</div>
        </div>
        <div style="flex:1;min-width:0">
          <h4 style="margin-bottom:6px">AI Risk Assessment</h4>
          ${score.summary ? `<p style="font-size:13px;margin-bottom:8px">${esc(score.summary)}</p>` : ''}
          ${score.keyFactors?.length ? `<ul class="key-factors">${score.keyFactors.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
          <p style="font-size:11px;color:var(--text-muted);margin-top:8px">Last evaluated ${score.lastEvaluatedAt ? relativeTime(score.lastEvaluatedAt) : 'unknown'} · ${score.requestCount ?? '?'} requests analyzed</p>
        </div>
      </div>`;
    } else {
      html += `<div class="risk-summary" style="display:flex;align-items:center;gap:12px;color:var(--text-muted)">
        <div style="font-size:28px;font-weight:800;opacity:.3">—</div>
        <div>
          <div style="font-size:13px;font-weight:600">Not yet scored</div>
          <div style="font-size:12px">Risk score is computed after the first session log is received.</div>
        </div>
      </div>`;
    }

    // Stats strip
    const approved = requests.filter(r => ['approved', 'expired'].includes(r.status)).length;
    const denied = requests.filter(r => r.status === 'denied').length;
    const expiredUnanswered = requests.filter(r => r.status === 'expired_unanswered').length;
    const networkRev = requests.filter(r => r.revokedByNetworkLoss).length;
    html += `<div class="detail-grid">
      <div class="detail-stat"><div class="ds-val">${requests.length}</div><div class="ds-lbl">Total requests</div></div>
      <div class="detail-stat"><div class="ds-val" style="color:var(--low)">${approved}</div><div class="ds-lbl">Approved</div></div>
      <div class="detail-stat"><div class="ds-val" style="color:var(--critical)">${denied}</div><div class="ds-lbl">Denied</div></div>
      ${expiredUnanswered > 0 ? `<div class="detail-stat"><div class="ds-val" style="color:var(--text-muted)">${expiredUnanswered}</div><div class="ds-lbl">No IT response</div></div>` : ''}
    </div>`;

    // Request history table
    html += `<div class="requests-section"><h4>Request History (${requests.length})</h4>`;
    if (requests.length === 0) {
      html += `<p class="no-requests">No requests found.</p>`;
    } else {
      html += `<table class="req-table">
        <thead><tr>
          <th>Date</th><th>Device</th><th>Category</th><th>Duration</th><th>Reason</th><th>Status</th><th>Log</th>
        </tr></thead>
        <tbody>
        ${requests.map(r => {
          const statusClass = `status-${r.status.replace(/[^a-z_]/gi, '')}`;
          const statusLabel = statusLabel_fn(r);
          const logId = `log-${esc(r.requestId)}`;
          const hasLog = !!r.logContent;
          const logRow = hasLog ? `<tr class="sudo-log-row" id="${logId}" style="display:none">
            <td colspan="7"><pre class="sudo-log-pre">${esc(r.logContent)}</pre></td>
          </tr>` : '';
          return `<tr>
            <td style="white-space:nowrap;color:var(--text-muted)">${formatDate(r.createdAt)}</td>
            <td>${esc(r.deviceHostname || r.deviceSerial || '—')}</td>
            <td>${esc(categoryLabel(r.reasonCategory))}</td>
            <td>${r.requestedDuration ? `${r.requestedDuration}m` : '—'}${r.approvedDuration && r.approvedDuration !== r.requestedDuration ? ` → ${r.approvedDuration}m` : ''}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.reason || '')}">${esc((r.reason || '').slice(0, 80))}${r.reason?.length > 80 ? '…' : ''}</td>
            <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
            <td>${hasLog ? `<button class="log-toggle" onclick="toggleLog('${esc(r.requestId)}')">View</button>` : '<span style="color:var(--text-muted);font-size:11px">—</span>'}</td>
          </tr>${logRow}`;
        }).join('')}
        </tbody></table>`;
    }
    html += '</div>';
    return html;
  }

  // ─── Helpers ─────────────────────────────────────────────────────────────────

  function toggleLog(requestId) {
    const row = document.getElementById(`log-${requestId}`);
    if (!row) return;
    const btn = row.previousElementSibling?.querySelector('.log-toggle');
    const visible = row.style.display !== 'none';
    row.style.display = visible ? 'none' : 'table-row';
    if (btn) btn.textContent = visible ? 'View' : 'Hide';
  }

  function riskBadge(level, score) {
    const labels = { low: '🟢 Low', medium: '🟡 Medium', high: '🟠 High', critical: '🔴 Critical', unknown: '⬜ Unscored' };
    const cls = `badge-${level}`;
    return `<span class="risk-badge ${cls}">${labels[level] || '⬜ Unscored'}</span>`;
  }

  function riskColor(level) {
    return { low: 'var(--low)', medium: 'var(--medium)', high: 'var(--high)', critical: 'var(--critical)' }[level] || 'var(--text-muted)';
  }

  function categoryLabel(cat) {
    return { install: '📦 Install', debug: '🔍 Debug', config: '⚙️ Config', security: '🔒 Security', developer: '🛠 Dev Tools', other: '📝 Other' }[cat] || cat || '—';
  }

  function statusLabel_fn(r) {
    if (r.lockedByIT) return '🔒 Device Locked';
    if (r.revokedByNetworkLoss) return '⚠️ Network Loss';
    if (r.revokedEarly) return '⛔ Revoked Early';
    return { approved: '✅ Active', expired: '🔒 Expired', pending: '⏳ Pending', denied: '❌ Denied', expired_unanswered: '⏰ Expired (no IT response)', completed_by_user: '✅ Ended by user' }[r.status] || r.status;
  }

  function relativeTime(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 2) return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    if (d < 7) return `${d}d ago`;
    return new Date(iso).toLocaleDateString();
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;').replace(/`/g,'&#x60;');
  }

  // ─── Init ─────────────────────────────────────────────────────────────────────

  (function init() {
    // Token from Slack link: skip auth screen and go straight to dashboard
    if (_TOKEN && _HAS_EMBEDDED_URL) {
      const user = _urlParams.get('user');
      if (user) window._targetUser = user;
      showApp();
      return;
    }

    const session = getSession();
    if (session) {
      // Pre-fill the inputs in case session expires and user needs to re-auth
      if (document.getElementById('api-url-input')) document.getElementById('api-url-input').value = session.url || '';
      showApp();
    } else if (_HAS_EMBEDDED_URL) {
      // URL is baked in but no token — hide the URL field, only ask for API key
      const urlField = document.getElementById('api-url-input');
      if (urlField) urlField.style.display = 'none';
      const desc = document.querySelector('.auth-card p');
      if (desc) desc.textContent = 'Enter your dashboard API key to continue.';
    }

    // Allow pressing Enter to log in
    document.getElementById('api-key-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // Pre-fill user from query param (e.g. when linked from Slack with ?user=jdoe)
    const user = _urlParams.get('user');
    if (user) {
      window._targetUser = user;
      document.getElementById('search-input') && (document.getElementById('search-input').value = user);
    }
  })();
</script>
</body>
</html>
